name: Windows Builds

on:
  push:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  build:
    name: Windows Build
    permissions: write-all
    runs-on: windows-latest
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore existing build cache for faster compilation
        uses: actions/cache@v4.2.3
        with:
          key: cache-build-windows
          path: |
            .haxelib/
            .hxcpp_cache/
            export/release/windows/haxe/
            export/release/windows/obj/

      - name: Installing/Updating libraries
        shell: cmd
        run: |
          haxelib setup .haxelib
          haxelib install lime 8.3.2
          haxelib install openfl 9.5.2
          haxelib install flixel 5.5.0
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-ui 2.6.1
          haxelib install hxcpp 4.3.2
          haxelib install hxCodec 3.0.2
          haxelib install hxvlc
          haxelib install tjson 1.4.0
          haxelib install compiletime
          haxelib install hxcpp-debug-server
          haxelib remove SScript 8.1.6 >nul 2>&1
          curl.exe -L --fail --retry 3 -o SScript-8.1.6.zip https://github.com/NovaFlare-Engine-haxelib/SScript-8.1.6/archive/refs/heads/main.zip
          haxelib install SScript-8.1.6.zip
          del /q SScript-8.1.6.zip
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit master
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc main
          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set flixel 5.5.0
          haxelib set flixel-addons 3.2.2
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-ui 2.6.1
          haxelib set hxcpp 4.3.2
          haxelib set hxCodec 3.0.2
          haxelib set SScript 8.1.6
          haxelib set tjson 1.4.0

      - name: Verifying libraries
        shell: cmd
        run: |
          haxe -version
          haxelib list
          haxelib path flixel
          haxelib path flixel-addons
          haxelib path flixel-ui
          haxelib path SScript
          haxelib path hxCodec
          haxelib path hxvlc
          haxelib path compiletime

      - name: Building the game
        shell: cmd
        run: |
          haxelib run lime build windows -release -DCOMPILE_EXPERIMENTAL

      - name: Uploading artifact (executable)
        uses: actions/upload-artifact@v4
        with:
          name: BFDI26 (Executable Only)
          path: export/release/windows/bin/BFDI26.exe
          if-no-files-found: error

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: BFDI26
          path: export/release/windows/bin
          if-no-files-found: error

      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-windows") {
                console.log("Clearing " + cache.key + "...")
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Uploading new cache
        uses: actions/cache@v4.2.3
        with:
          key: cache-build-windows
          path: |
            .haxelib/
            .hxcpp_cache/
            export/release/windows/haxe/
            export/release/windows/obj/

  debug_build:
    name: Windows Debug Build
    permissions: write-all
    runs-on: windows-latest
    needs: build
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore existing build cache for faster compilation
        uses: actions/cache@v4.2.3
        with:
          key: cache-build-windows-debug
          path: |
            .haxelib/
            .hxcpp_cache/
            export/debug/windows/haxe/
            export/debug/windows/obj/

      - name: Installing/Updating libraries
        shell: cmd
        run: |
          haxelib setup .haxelib
          haxelib install lime 8.3.2
          haxelib install openfl 9.5.2
          haxelib install flixel 5.5.0
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-ui 2.6.1
          haxelib install hxcpp 4.3.2
          haxelib install hxCodec 3.0.2
          haxelib install hxvlc
          haxelib install SScript-8.1.6.zip 2>nul
          if errorlevel 1 (
            haxelib remove SScript 8.1.6 >nul 2>&1
            curl.exe -L --fail --retry 3 -o SScript-8.1.6.zip https://github.com/NovaFlare-Engine-haxelib/SScript-8.1.6/archive/refs/heads/main.zip
            haxelib install SScript-8.1.6.zip
            del /q SScript-8.1.6.zip
          )
          haxelib install tjson 1.4.0
          haxelib install compiletime
          haxelib install hxcpp-debug-server
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit master
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc main
          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set flixel 5.5.0
          haxelib set flixel-addons 3.2.2
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-ui 2.6.1
          haxelib set hxcpp 4.3.2
          haxelib set hxCodec 3.0.2
          haxelib set SScript 8.1.6
          haxelib set tjson 1.4.0

      - name: Verifying libraries
        shell: cmd
        run: |
          haxe -version
          haxelib list
          haxelib path flixel
          haxelib path flixel-addons
          haxelib path flixel-ui
          haxelib path SScript
          haxelib path hxCodec
          haxelib path hxvlc
          haxelib path compiletime

      - name: Building the game
        shell: cmd
        run: |
          haxelib run lime build windows -debug -DCOMPILE_EXPERIMENTAL

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: BFDI26 Debug
          path: export/debug/windows/bin
          if-no-files-found: error

      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-windows-debug") {
                console.log("Clearing " + cache.key + "...")
                await github.rest/actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Uploading new cache
        uses: actions/cache@v4.2.3
        with:
          key: cache-build-windows-debug
          path: |
            .haxelib/
            .hxcpp_cache/
            export/debug/windows/haxe/
            export/debug/windows/obj/
