name: Build BFDI26 (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Haxelib
        shell: pwsh
        run: |
          $libPath = "$env:USERPROFILE\haxelib"
          New-Item -ItemType Directory -Force -Path $libPath | Out-Null
          haxelib setup "$libPath"

      - name: Install pinned dependencies
        shell: cmd
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel 5.5.0
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-ui 2.6.1
          haxelib install flixel-tools
          haxelib install SScript 8.1.6
          haxelib install hxCodec
          haxelib install tjson
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc

      - name: Verify required versions
        shell: cmd
        run: |
          haxelib list
          haxelib path flixel 5.5.0
          haxelib path flixel-addons 3.2.2
          haxelib path flixel-ui 2.6.1
          haxelib path SScript 8.1.6

      - name: Setup Lime
        shell: cmd
        run: haxelib run lime setup

      - name: Build Windows release
        shell: cmd
        run: lime build windows -release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BFDI26-Windows
          path: export/release/windows
          if-no-files-found: error
